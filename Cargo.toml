[package]
name = "autograph-be"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
sea-orm = { version = "2.0.4", features = [
    "sqlx-postgres",
    "runtime-tokio-rustls",
    "macros"
] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
migration = { path = "./migration" }
serde = "1.0.229"
validator = { version = "0.20.0", features = ["derive"] }